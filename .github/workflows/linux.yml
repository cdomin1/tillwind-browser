name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Build Tillwind
        run: cargo +stable build --locked
